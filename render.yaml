# Free/demo backend: one Render web service runs both API and worker.
# For production scale, deploy docker/api.Dockerfile and docker/worker.Dockerfile separately.
services:
  - type: web
    name: omniconvert-backend
    runtime: docker
    plan: free
    dockerfilePath: docker/fullstack.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_DB_MIGRATIONS
        value: "true"
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: WEB_ORIGIN
        value: "*"
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /app/storage
      - key: S3_BUCKET
        value: local
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: UPLOAD_CHUNK_BYTES
        value: "4194304"
      - key: CLAMAV_REQUIRED
        value: "false"
      - key: AWS_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: omniconvert-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: omniconvert-redis
          property: connectionString

  - type: keyvalue
    name: omniconvert-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: omniconvert-db
    plan: free
    databaseName: omniconvert
    user: omniconvert
    ipAllowList: []
